<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Kartu Member IMPHNEN 3D</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; overflow: hidden; color: #eaf5ff;
        background: radial-gradient(ellipse at 50% 42%, #203b66, #091326 72%);
        font: 600 15px system-ui, sans-serif;
      }
      main { width: 100%; min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; }
      .scene { width: min(92vw, 850px); perspective: 1400px; }
      .card {
        position: relative; width: 100%; aspect-ratio: 1.586; transform-style: preserve-3d;
        border-radius: 3.2%; background: #10234a; box-shadow: 0 34px 90px #0008;
        animation: rotate 14s ease-in-out infinite;
      }
      .face { position: absolute; inset: 0; overflow: hidden; border: 1px solid #ffffff35; border-radius: inherit; backface-visibility: hidden; }
      .face img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .front { transform: translateZ(5px); }
      .back { transform: rotateY(180deg) translateZ(5px); }
      .edge { position: absolute; inset: 0; border: 5px solid #15315f; border-radius: inherit; transform: translateZ(0); }
      .label { margin: 25px 0 0; text-align: center; color: #b9cee8; }
      button { display: block; margin: 16px auto 0; padding: 10px 16px; border: 1px solid #ffffff30; border-radius: 999px; background: #ffffff12; color: inherit; font: inherit; cursor: pointer; }
      @keyframes rotate { 0%, 8% { transform: rotateY(0) rotateX(3deg); } 42%, 58% { transform: rotateY(180deg) rotateX(-3deg); } 92%, 100% { transform: rotateY(360deg) rotateX(3deg); } }
      .paused { animation-play-state: paused; }
      @media (prefers-reduced-motion: reduce) { .card { animation-duration: 30s; } }
    </style>
  </head>
  <body>
    <main>
      <div class="scene">
        <div class="card" id="card">
          <div class="face front"><img id="front" alt="Sisi depan kartu member"></div>
          <div class="face back"><img id="back" alt="Sisi belakang kartu member"></div>
          <div class="edge"></div>
        </div>
        <p class="label">Kartu Member IMPHNEN · model 3D</p>
        <button id="toggle" type="button">Jeda rotasi</button>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const gateway = (cid) => `https://gateway.pinata.cloud/ipfs/${encodeURIComponent(cid)}`;
      const front = params.get("front");
      const back = params.get("back");
      if (front) document.getElementById("front").src = gateway(front);
      if (back) document.getElementById("back").src = gateway(back);
      const card = document.getElementById("card");
      const button = document.getElementById("toggle");
      button.addEventListener("click", () => {
        const paused = card.classList.toggle("paused");
        button.textContent = paused ? "Lanjutkan rotasi" : "Jeda rotasi";
      });
    </script>
  </body>
</html>
